name: Deploy para o GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sem permissões por omissão; cada job pede só as de que precisa.
permissions: {}

# Um deploy de cada vez; não cancela o que já está a correr.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# As actions estão fixadas pelo commit (SHA), não pela etiqueta: uma etiqueta
# pode ser movida por quem controlar o repositório da action, um commit não.
# O comentário indica a versão; o Dependabot propõe atualizações.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vulnerabilidades conhecidas nas dependências de produção
        run: pnpm audit --prod

      - name: Verificação de tipos
        run: pnpm check

      - name: Testes
        run: pnpm test

      - name: Build
        env:
          # Num site de projeto o caminho é /<repositório>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: SPA fallback
        # O GitHub Pages não reescreve rotas para o index.html. Servir o mesmo
        # conteúdo em 404.html faz com que /operation-detail/12 funcione ao ser
        # aberto diretamente ou recarregado.
        run: cp dist/index.html dist/404.html

      - name: Impedir o processamento pelo Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Pull requests só verificam; só a main é publicada.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
